# fly.toml app configuration file generated for react-storefront-1 on 2025-08-16T17:29:30+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "react-storefront"
primary_region = 'jnb'

[build]

[build.args]
  NEXT_PUBLIC_SALEOR_API_URL = 'https://saleor.fly.dev/graphql/'
  NEXT_PUBLIC_STOREFRONT_URL = 'https://react-storefront.fly.dev'


[env]
  NEXT_PUBLIC_SALEOR_API_URL = 'https://saleor.fly.dev/graphql/'
  NEXT_PUBLIC_STOREFRONT_URL = 'https://react-storefront.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
